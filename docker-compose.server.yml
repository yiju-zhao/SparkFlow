# SparkFlow SERVER compose — full stack with corporate-proxy (NO_PROXY)
# and TLS-MITM (corporate CA bundle) wiring.
#
# Usage on the server:
#   1. cp .env.example .env       # the ONE file you edit; fill in secrets
#   2. cp /path/to/your-ca.crt ./ca-certificates.crt   # or `touch` for open networks
#   3. docker compose -f docker-compose.server.yml --profile prod up -d --build
#
# Single source of truth: every service uses `env_file: ./.env`. Compose
# also reads it for ${VAR} substitution at parse time. Same file, both
# layers — no precedence puzzle, no cross-file sync to maintain.
#
# For local dev (no proxy, host Next.js + langgraph), use docker-compose.yml.

name: sparkflow

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sparkflow-postgres
    env_file: ./.env
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sparkflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot postgres bootstrap. Creates sparkflow_checkpoints (used by the
  # langgraph CLI's --postgres-uri so it doesn't need to spin up a sibling
  # langgraph-postgres of its own — corp-network docker DNS can't resolve
  # sibling hostnames reliably). Idempotent: skips when the DB already
  # exists, so re-running `up -d` is safe. `restart: "no"` because this
  # exits 0 once done.
  postgres-init:
    image: pgvector/pgvector:pg17
    container_name: sparkflow-postgres-init
    env_file: ./.env
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: []
    command:
      - sh
      - -c
      - |
        set -e
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        if psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc \
             "SELECT 1 FROM pg_database WHERE datname='sparkflow_checkpoints'" \
             | grep -q 1; then
          echo "[postgres-init] sparkflow_checkpoints already exists"
        else
          psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
            -c "CREATE DATABASE sparkflow_checkpoints"
          echo "[postgres-init] created sparkflow_checkpoints"
        fi
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: sparkflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: sparkflow-searxng
    env_file: ./.env
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng/config:/etc/searxng:rw
      - ./searxng/data:/var/cache/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
    restart: unless-stopped

  ingest-worker:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.worker
      additional_contexts:
        certs: ./       # Dockerfiles do `COPY --from=certs ca-certificates.crt …`
    container_name: sparkflow-ingest-worker
    command: ["npm", "run", "worker:ingest"]
    env_file: ./.env
    volumes:
      - ./ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  semops:
    build:
      context: ./apps/semops
      dockerfile: Dockerfile
      additional_contexts:
        certs: ./
    container_name: sparkflow-semops
    env_file: ./.env
    ports:
      - "${SEMOPS_PORT:-2025}:2025"
    volumes:
      - ./ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2025/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  digest-worker:
    # Pinned to the `prod` profile because this worker forwards every
    # arq job to workflows-api over HTTP, and workflows-api is itself
    # prod-only. Without this, default-profile compose commands fail
    # with `service "digest-worker" depends on undefined service
    # "workflows-api"` — compose can't resolve the dep when only one
    # of the pair is in scope.
    profiles: ["prod"]
    build:
      context: ./apps/langgraph
      dockerfile: Dockerfile.worker
      additional_contexts:
        certs: ./
    container_name: sparkflow-digest-worker
    command: ["arq", "workflows.digest_worker.WorkerSettings"]
    env_file: ./.env
    # The worker forwards arq jobs to the workflows-api over HTTP — see
    # apps/langgraph/workflows/digest_tasks.py. Pin the URL inline so it
    # doesn't depend on .env being current; on this network the API is
    # always reachable as http://workflows-api:2027.
    environment:
      WORKFLOWS_API_URL: http://workflows-api:2027
    volumes:
      - ./ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      redis:
        condition: service_healthy
      semops:
        condition: service_healthy
      workflows-api:
        condition: service_started
    restart: unless-stopped

  # ── Production-only services (opt-in via --profile prod) ──────────────────

  workflows-api:
    profiles: ["prod"]
    build:
      context: ./apps/langgraph
      dockerfile: Dockerfile.workflows-api
      additional_contexts:
        certs: ./
    container_name: sparkflow-workflows-api
    env_file: ./.env
    ports:
      - "${WORKFLOWS_PORT:-2027}:2027"
    volumes:
      - ./ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      semops:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    profiles: ["prod"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      # Use builder stage: it has full node_modules (incl. prisma CLI's
      # transitive deps like `effect`). The slim runner stage only carries
      # cherry-picked @prisma/* dirs and breaks at CLI load time.
      target: builder
      additional_contexts:
        certs: ./
    container_name: sparkflow-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: ./.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    profiles: ["prod"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
      additional_contexts:
        certs: ./
    container_name: sparkflow-web
    env_file: ./.env
    ports:
      - "${WEB_PORT:-3001}:3001"
    volumes:
      - ./ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      # Persist matcher result Excel cache across container rebuilds.
      # Path matches DATA_DIR = path.join(process.cwd(), "data") in
      # apps/web/app/api/matcher/jobs/[jobId]/route.ts.
      - web_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      workflows-api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  web_data:
