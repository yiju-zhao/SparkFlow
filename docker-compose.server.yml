# SparkFlow SERVER compose — full stack with corporate-proxy (NO_PROXY)
# and TLS-MITM (corporate CA bundle) wiring.
#
# Usage on the server:
#   1. Place a full CA bundle (system roots + corporate CA, concatenated) at
#        ca-certificates.crt
#      A missing host file makes Docker create an empty dir at the mount
#      path and break all TLS in the container; an empty file breaks all
#      TLS via missing roots — hence the bundle MUST exist before `up`.
#      On non-MITM hosts: `touch ca-certificates.crt` is enough.
#   2. cp .env.proxy.example .env.proxy   (server-only env file)
#   3. docker compose -f docker-compose.server.yml --profile prod up -d --build
#
# For local dev (no proxy / no corporate CA), use docker-compose.yml instead:
#   docker compose up -d
#
# Configuration model: same as docker-compose.yml — no ${VAR} substitution
# for app config, all env via env_file lists. The server file adds:
#   - .env.proxy in the env_file list of every outbound-talking service
#   - bind-mount of ./ca-certificates.crt onto /etc/ssl/certs/ca-certificates.crt
#
# .env.proxy contains NO_PROXY (lists all docker service hostnames so
# library-level proxy code skips them) + REQUESTS_CA_BUNDLE / SSL_CERT_FILE
# / CURL_CA_BUNDLE pointing at the mounted bundle.

name: sparkflow

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sparkflow-postgres
    env_file: ./apps/web/.env
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sparkflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sparkflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: sparkflow-searxng
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng/config:/etc/searxng:rw
      - ./searxng/data:/var/cache/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-sparkflow-default-rotate-in-prod}
    restart: unless-stopped

  ingest-worker:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.worker
    container_name: sparkflow-ingest-worker
    command: ["npm", "run", "worker:ingest"]
    env_file:
      - ./apps/web/.env
      - ./.env.proxy
    volumes:
      - ./ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  semops:
    build:
      context: ./apps/semops
      dockerfile: Dockerfile
    container_name: sparkflow-semops
    env_file: ./.env.proxy
    ports:
      - "${SEMOPS_PORT:-2025}:2025"
    volumes:
      - ./ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2025/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  digest-worker:
    build:
      context: ./apps/langgraph
      dockerfile: Dockerfile.worker
    container_name: sparkflow-digest-worker
    command: ["arq", "workflows.digest_worker.WorkerSettings"]
    env_file:
      - ./apps/web/.env
      - ./apps/langgraph/.env
      - ./.env.proxy
    volumes:
      - ./ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      redis:
        condition: service_healthy
      semops:
        condition: service_healthy
    restart: unless-stopped

  # ── Production-only services (opt-in via --profile prod) ──────────────────

  workflows-api:
    profiles: ["prod"]
    build:
      context: ./apps/langgraph
      dockerfile: Dockerfile.workflows-api
    container_name: sparkflow-workflows-api
    env_file:
      - ./apps/web/.env
      - ./apps/langgraph/.env
      - ./.env.proxy
    ports:
      - "${WORKFLOWS_PORT:-2027}:2027"
    volumes:
      - ./ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      semops:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    profiles: ["prod"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: builder
    container_name: sparkflow-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - ./apps/web/.env
      - ./.env.proxy
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    profiles: ["prod"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
    container_name: sparkflow-web
    env_file:
      - ./apps/web/.env
      - ./.env.proxy
    ports:
      - "${WEB_PORT:-3001}:3001"
    volumes:
      - ./ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      workflows-api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
