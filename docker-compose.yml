# SparkFlow LOCAL dev compose — Postgres + Redis + workers (+ optional prod stack).
# Usage:
#   docker compose up -d                    # postgres + redis + searxng + workers
#   docker compose --profile prod up -d     # also brings up web + workflows-api + migrate
#
# This file is the LOCAL version: NO corporate-proxy (NO_PROXY) wiring,
# NO TLS-MITM CA bundle mount. For production / corporate-network deploys,
# use docker-compose.server.yml instead:
#   docker compose -f docker-compose.server.yml --profile prod up -d --build
#
# Configuration model: ALL container env comes from `env_file:` — there is
# NO ${VAR} substitution for app config in this file. The only ${...}
# left is for compose-level meta (port mappings) which fall back to
# sensible defaults if unset.
#
# Cross-cutting vars (INTERNAL_CALLBACK_TOKEN, POSTGRES_*, DATABASE_URL,
# REDIS_URL, SEMOPS_API_URL, SEARXNG_URL, SPARKFLOW_API_URL) live ONLY
# in apps/web/.env — langgraph services pick them up via env_file lists.
# No duplication, no sync risk.

name: sparkflow

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sparkflow-postgres
    env_file: ./apps/web/.env       # POSTGRES_USER/PASSWORD/DB
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sparkflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sparkflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Self-hosted SearXNG — default web search backend used by
  # apps/langgraph/tools/web.py when no Tavily BYOK key is provided.
  # Internal use only (limiter disabled in config/settings.yml).
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: sparkflow-searxng
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng/config:/etc/searxng:rw
      - ./searxng/data:/var/cache/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-sparkflow-default-rotate-in-prod}
    restart: unless-stopped

  ingest-worker:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.worker
      additional_contexts:
        certs: ./
    container_name: sparkflow-ingest-worker
    command: ["npm", "run", "worker:ingest"]
    env_file: ./apps/web/.env
    # Local-dev override: apps/web/.env points at localhost (so `npm run dev`
    # on the host works), but the worker runs INSIDE the compose network.
    # Literal values — no ${VAR} substitution, no footgun.
    environment:
      DATABASE_URL: postgresql://sparkflow:sparkflow@postgres:5432/sparkflow
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # SemOps — LOTUS-backed semantic operators (sem_rank etc.) used by the
  # matcher / daily_digest / search workflows in apps/langgraph. Stateless
  # FastAPI service; no DB, no Redis. First build is slow (lotus-ai pulls
  # torch + transformers + faiss-cpu).
  semops:
    build:
      context: ./apps/semops
      dockerfile: Dockerfile
      additional_contexts:
        certs: ./
    container_name: sparkflow-semops
    ports:
      - "${SEMOPS_PORT:-2025}:2025"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2025/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  digest-worker:
    build:
      context: ./apps/langgraph
      dockerfile: Dockerfile.worker
      additional_contexts:
        certs: ./
    container_name: sparkflow-digest-worker
    command: ["arq", "workflows.digest_worker.WorkerSettings"]
    env_file:
      - ./apps/web/.env             # shared: INTERNAL_CALLBACK_TOKEN, SPARKFLOW_API_URL
      - ./apps/langgraph/.env       # langgraph-only: DIGEST_WORKER_CONCURRENCY, LANGSMITH_*
    # Local-dev override: in-docker hostname for redis + semops.
    environment:
      REDIS_URL: redis://redis:6379
      SEMOPS_API_URL: http://semops:2025
      SPARKFLOW_API_URL: http://host.docker.internal:3001  # web runs on host in dev mode
    depends_on:
      redis:
        condition: service_healthy
      semops:
        condition: service_healthy
    restart: unless-stopped

  # ── Production-only services (opt-in via --profile prod) ──────────────────
  # Default `docker compose up -d` runs only postgres/redis/searxng/workers
  # so local dev keeps using `npm run dev` on the host (faster HMR) and
  # `make serve` on the host (which also binds 2027 — a docker workflows-api
  # running by default would conflict with it).
  # For a production-style stack on the SERVER, use docker-compose.server.yml:
  #     docker compose -f docker-compose.server.yml --profile prod up -d --build

  workflows-api:
    profiles: ["prod"]
    build:
      context: ./apps/langgraph
      dockerfile: Dockerfile.workflows-api
      additional_contexts:
        certs: ./
    container_name: sparkflow-workflows-api
    env_file:
      - ./apps/web/.env             # shared
      - ./apps/langgraph/.env       # langgraph-only: CHECKPOINT_DB_URL, LANGSMITH_*
    # Local-dev override: in-docker hostnames for postgres + redis + semops.
    environment:
      DATABASE_URL: postgresql://sparkflow:sparkflow@postgres:5432/sparkflow
      REDIS_URL: redis://redis:6379
      SEMOPS_API_URL: http://semops:2025
      SEARXNG_URL: http://searxng:8080
    ports:
      - "${WORKFLOWS_PORT:-2027}:2027"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      semops:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    profiles: ["prod"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      # Use builder stage: it has full node_modules (incl. prisma CLI's
      # transitive deps like `effect`). The slim runner stage only carries
      # cherry-picked @prisma/* dirs and breaks at CLI load time.
      target: builder
      additional_contexts:
        certs: ./
    container_name: sparkflow-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: ./apps/web/.env
    # Local-dev override: in-docker hostname for postgres.
    environment:
      DATABASE_URL: postgresql://sparkflow:sparkflow@postgres:5432/sparkflow
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    profiles: ["prod"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
      additional_contexts:
        certs: ./
    container_name: sparkflow-web
    env_file: ./apps/web/.env
    # Local-dev override: in-docker hostnames + LangGraph on host.
    environment:
      DATABASE_URL: postgresql://sparkflow:sparkflow@postgres:5432/sparkflow
      REDIS_URL: redis://redis:6379
      LANGGRAPH_API_URL: http://host.docker.internal:2024
      WORKFLOWS_API_URL: http://workflows-api:2027
      NEXT_PUBLIC_WORKFLOWS_API_URL: http://localhost:2027
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      workflows-api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
