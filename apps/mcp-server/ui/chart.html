<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Chart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 16px;
            background: var(--background, #ffffff);
            color: var(--foreground, #171717);
        }

        .chart-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
            color: var(--foreground, #171717);
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted-foreground, #737373);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted-foreground, #737373);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border, #e5e5e5);
            border-top-color: var(--primary, #00D084);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Loading chart...</div>
        </div>
        <div id="content" style="display: none;">
            <h3 id="title" class="chart-title"></h3>
            <div class="chart-wrapper">
                <canvas id="chart"></canvas>
            </div>
        </div>
        <div id="empty-state" class="empty-state" style="display: none;">
            <div class="empty-state-icon">📈</div>
            <div>No data to display</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script>
        let chartInstance = null;
        let rpcId = 0;

        // Color palette matching hub theme
        const DEFAULT_COLORS = [
            '#00D084', // Primary green
            '#3b82f6', // Blue
            '#eab308', // Yellow
            '#a855f7', // Purple
            '#ef4444', // Red
            '#f97316', // Orange
            '#06b6d4', // Cyan
            '#ec4899', // Pink
        ];

        function notifyParent(method, params = {}) {
            window.parent?.postMessage({
                jsonrpc: '2.0',
                method,
                params,
            }, '*');
        }

        function requestParent(method, params = {}) {
            rpcId += 1;
            window.parent?.postMessage({
                jsonrpc: '2.0',
                id: `chart-${rpcId}`,
                method,
                params,
            }, '*');
        }

        function updateSize() {
            const body = document.body;
            notifyParent('ui/notifications/size-changed', {
                width: Math.ceil(body.scrollWidth),
                height: Math.ceil(body.scrollHeight),
            });
        }

        function tryParseJson(value) {
            if (typeof value !== 'string') return null;
            try {
                return JSON.parse(value);
            } catch {
                return null;
            }
        }

        function normalizeToolResult(params) {
            if (!params) {
                return {};
            }

            if (params.structuredContent && typeof params.structuredContent === 'object') {
                return params.structuredContent;
            }

            if (Array.isArray(params.content)) {
                const textBlocks = params.content
                    .filter((item) => item && item.type === 'text' && typeof item.text === 'string')
                    .map((item) => item.text)
                    .filter(Boolean);

                for (const text of textBlocks) {
                    const parsed = tryParseJson(text);
                    if (!parsed) continue;

                    if (parsed.structuredContent && typeof parsed.structuredContent === 'object') {
                        return parsed.structuredContent;
                    }

                    if (typeof parsed === 'object') {
                        return parsed;
                    }
                }
            }

            const parsedParams = tryParseJson(params);
            if (parsedParams) {
                if (parsedParams.structuredContent && typeof parsedParams.structuredContent === 'object') {
                    return parsedParams.structuredContent;
                }
                return parsedParams;
            }

            return params || {};
        }

        window.addEventListener('message', (event) => {
            const message = event.data;
            if (!message || typeof message !== 'object' || message.jsonrpc !== '2.0') {
                return;
            }

            if (message.method !== 'ui/notifications/tool-result') {
                return;
            }

            const data = normalizeToolResult(message.params);
            
            // Extract chart configuration
            const chartType = data.type || 'bar';
            const chartData = data.data || data.values || [];
            const chartLabels = data.labels || [];
            const chartTitle = data.title || 'Chart';
            const chartColors = data.colors || DEFAULT_COLORS;

            // Handle different data formats
            let processedData = chartData;
            let processedLabels = chartLabels;

            // If data is an array of objects, try to extract labels and values
            if (Array.isArray(chartData) && chartData.length > 0 && typeof chartData[0] === 'object') {
                const keys = Object.keys(chartData[0]);
                if (keys.length >= 2) {
                    processedLabels = chartData.map(item => item[keys[0]]);
                    processedData = chartData.map(item => {
                        const val = item[keys[1]];
                        return typeof val === 'number' ? val : parseFloat(val) || 0;
                    });
                }
            }

            // Render the chart
            renderChart(chartType, processedData, processedLabels, chartTitle, chartColors);
        });

        function renderChart(type, data, labels, title, colors) {
            document.getElementById('loading').style.display = 'none';

            // Check for empty data
            if (!data || data.length === 0) {
                document.getElementById('content').style.display = 'none';
                document.getElementById('empty-state').style.display = 'block';
                updateSize();
                return;
            }

            document.getElementById('content').style.display = 'block';
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('title').textContent = title;

            // Destroy existing chart
            if (chartInstance) {
                chartInstance.destroy();
            }

            // Get canvas context
            const ctx = document.getElementById('chart').getContext('2d');

            // Configure chart based on type
            const isPie = type === 'pie' || type === 'doughnut';
            const backgroundColors = isPie 
                ? colors.slice(0, data.length).map(c => c + 'cc') // Add transparency for pie
                : colors[0] + 'cc';

            const config = {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        label: title,
                        data: data,
                        backgroundColor: backgroundColors,
                        borderColor: isPie ? colors.slice(0, data.length) : colors[0],
                        borderWidth: isPie ? 2 : 1,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: isPie,
                            position: 'bottom',
                            labels: {
                                padding: 16,
                                usePointStyle: true,
                            }
                        },
                        title: {
                            display: false // We use our own title element
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleFont: { size: 14 },
                            bodyFont: { size: 13 },
                            padding: 12,
                            cornerRadius: 8,
                        }
                    },
                    scales: isPie ? {} : {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)',
                            },
                            ticks: {
                                precision: 0,
                            }
                        },
                        x: {
                            grid: {
                                display: false,
                            }
                        }
                    },
                    animation: {
                        duration: 500,
                        easing: 'easeOutQuart'
                    }
                }
            };

            // Create chart
            chartInstance = new Chart(ctx, config);
            updateSize();
        }

        requestParent('ui/initialize');
        notifyParent('ui/notifications/initialized');
        updateSize();
    </script>
</body>
</html>
