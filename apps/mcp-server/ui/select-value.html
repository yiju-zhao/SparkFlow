<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Value</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background, #fff);
            color: var(--foreground, #171717);
        }
        .card {
            border: 1px solid var(--border, #e5e5e5);
            border-radius: 16px;
            padding: 16px;
            background: linear-gradient(180deg, rgba(0, 208, 132, 0.06), rgba(255,255,255,0));
        }
        .title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .instruction { font-size: 13px; color: #525252; margin-bottom: 12px; }
        .list { display: grid; gap: 8px; }
        .option {
            border: 1px solid var(--border, #e5e5e5);
            border-radius: 12px;
            padding: 10px 12px;
            background: #fff;
            cursor: pointer;
        }
        .option.active { border-color: #00D084; background: rgba(0, 208, 132, 0.08); }
        .option-label { font-size: 14px; font-weight: 500; }
        .option-meta { font-size: 12px; color: #666; margin-top: 2px; }
        .footer {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .selection { font-size: 13px; color: #444; min-height: 18px; }
        .button {
            border: 0;
            border-radius: 10px;
            padding: 8px 12px;
            background: #00D084;
            color: white;
            font-weight: 600;
        }
        .button.secondary {
            background: #f1f5f9;
            color: #111827;
        }
        .button:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <div class="card">
        <div id="title" class="title">Select a value</div>
        <div id="instruction" class="instruction"></div>
        <div id="list" class="list"></div>
        <div class="footer">
            <div id="selection" class="selection"></div>
            <div class="actions">
                <button id="cancel" class="button secondary" style="display: none;">Cancel</button>
                <button id="confirm" class="button" disabled>Use Selection</button>
            </div>
        </div>
    </div>

    <script>
        let rpcId = 0;
        let selected = null;
        let payload = null;
        let submitCounter = 0;

        function notifyParent(method, params = {}) {
            window.parent?.postMessage({ jsonrpc: '2.0', method, params }, '*');
        }
        function requestParent(method, params = {}) {
            rpcId += 1;
            window.parent?.postMessage({ jsonrpc: '2.0', id: `select-${rpcId}`, method, params }, '*');
        }
        function updateSize() {
            notifyParent('ui/notifications/size-changed', {
                width: Math.ceil(document.body.scrollWidth),
                height: Math.ceil(document.body.scrollHeight),
            });
        }
        function emitWorkflowSubmit(action, content, metadata = {}) {
            submitCounter += 1;
            window.parent?.postMessage({
                type: 'sparkflow.workflow.submit',
                workflowId: `select-value-${Date.now()}-${submitCounter}`,
                source: 'select-value',
                action,
                content,
                metadata,
            }, '*');
        }
        function tryParseJson(value) {
            if (typeof value !== 'string') return null;
            try { return JSON.parse(value); } catch { return null; }
        }
        function fillTemplate(template, data) {
            if (!template || typeof template !== 'string') return '';
            return template
                .replaceAll('{{value}}', data.value || '')
                .replaceAll('{{label}}', data.label || data.value || '')
                .replaceAll('{{field}}', payload?.field || 'value');
        }
        function normalizeToolResult(params) {
            if (!params) return {};
            if (params.structuredContent && typeof params.structuredContent === 'object') return params.structuredContent;
            if (Array.isArray(params.content)) {
                const text = params.content.find((item) => item && item.type === 'text' && typeof item.text === 'string')?.text;
                const parsed = tryParseJson(text);
                if (parsed?.structuredContent) return parsed.structuredContent;
                if (parsed && typeof parsed === 'object') return parsed;
            }
            return params;
        }
        function render(data) {
            payload = data;
            document.getElementById('title').textContent = data.title || 'Select a value';
            document.getElementById('instruction').textContent = data.instruction || `Choose the ${data.field || 'value'} to use.`;
            document.getElementById('confirm').textContent = data.confirmLabel || 'Use Selection';
            const cancelButton = document.getElementById('cancel');
            if (data.cancelPrompt) {
                cancelButton.style.display = 'inline-flex';
            } else {
                cancelButton.style.display = 'none';
            }
            const list = document.getElementById('list');
            list.innerHTML = '';
            (data.options || []).forEach((option, index) => {
                const el = document.createElement('button');
                el.type = 'button';
                el.className = 'option';
                el.innerHTML = `<div class="option-label">${option.label || option.value || ''}</div>` +
                    `<div class="option-meta">${option.count != null ? `${option.count} matches` : ''}${option.description ? (option.count != null ? ' · ' : '') + option.description : ''}</div>`;
                el.addEventListener('click', () => {
                    selected = option;
                    [...list.children].forEach((child) => child.classList.remove('active'));
                    el.classList.add('active');
                    document.getElementById('selection').textContent = `Selected ${data.field || 'value'}: ${option.value || option.label}`;
                    document.getElementById('confirm').disabled = false;
                    updateSize();
                });
                if (index === 0) {
                    // Keep a default visible path without auto-submitting.
                    document.getElementById('selection').textContent = 'Choose one option to continue.';
                }
                list.appendChild(el);
            });
            updateSize();
        }

        document.getElementById('confirm').addEventListener('click', () => {
            if (!selected || !payload) return;
            const selectionValue = selected.value || selected.label || '';
            const followUpMessage = fillTemplate(payload.continuePromptTemplate, selected) ||
                `Continue the previous request using ${payload.field || 'value'} = "${selectionValue}".`;
            document.getElementById('selection').textContent = `Confirmed ${payload.field || 'value'}: ${selectionValue}`;
            emitWorkflowSubmit('confirm', followUpMessage, {
                field: payload.field || 'value',
                selected,
            });
            updateSize();
        });
        document.getElementById('cancel').addEventListener('click', () => {
            if (!payload?.cancelPrompt) return;
            document.getElementById('selection').textContent = 'Selection cancelled.';
            emitWorkflowSubmit('cancel', payload.cancelPrompt, {
                field: payload.field || 'value',
            });
            updateSize();
        });

        window.addEventListener('message', (event) => {
            const message = event.data;
            if (!message || typeof message !== 'object' || message.jsonrpc !== '2.0') return;
            if (message.method === 'ui/notifications/tool-result') {
                render(normalizeToolResult(message.params));
            }
        });

        requestParent('ui/initialize');
        notifyParent('ui/notifications/initialized');
        updateSize();
    </script>
</body>
</html>
