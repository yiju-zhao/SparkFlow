<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stat Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 12px;
            background: transparent;
            color: var(--foreground, #171717);
        }

        .card {
            border: 1px solid var(--border, #e5e5e5);
            border-radius: 16px;
            padding: 18px;
            background: linear-gradient(135deg, rgba(0, 208, 132, 0.08), rgba(59, 130, 246, 0.04));
            min-width: 220px;
        }

        .loading {
            text-align: center;
            color: var(--muted-foreground, #737373);
            padding: 24px 16px;
        }

        .title {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted-foreground, #525252);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .value {
            font-size: 40px;
            line-height: 1;
            font-weight: 700;
            color: var(--foreground, #171717);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--muted-foreground, #525252);
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">Loading metric...</div>
    <div id="card" class="card" style="display: none;">
        <div id="title" class="title"></div>
        <div id="value" class="value"></div>
        <div id="subtitle" class="subtitle"></div>
    </div>

    <script>
        let rpcId = 0;

        function notifyParent(method, params = {}) {
            window.parent?.postMessage({
                jsonrpc: '2.0',
                method,
                params,
            }, '*');
        }

        function requestParent(method, params = {}) {
            rpcId += 1;
            window.parent?.postMessage({
                jsonrpc: '2.0',
                id: `stat-card-${rpcId}`,
                method,
                params,
            }, '*');
        }

        function updateSize() {
            notifyParent('ui/notifications/size-changed', {
                width: Math.ceil(document.body.scrollWidth),
                height: Math.ceil(document.body.scrollHeight),
            });
        }

        function tryParseJson(value) {
            if (typeof value !== 'string') return null;
            try {
                return JSON.parse(value);
            } catch {
                return null;
            }
        }

        function normalizeToolResult(params) {
            if (!params) return {};
            if (params.structuredContent && typeof params.structuredContent === 'object') {
                return params.structuredContent;
            }
            if (Array.isArray(params.content)) {
                const textBlock = params.content.find(
                    (item) => item && item.type === 'text' && typeof item.text === 'string'
                );
                const parsed = tryParseJson(textBlock?.text);
                if (parsed?.structuredContent) return parsed.structuredContent;
                if (parsed && typeof parsed === 'object') return parsed;
            }
            return params;
        }

        function formatValue(value) {
            if (value == null) return '—';
            if (typeof value === 'number') {
                return new Intl.NumberFormat().format(value);
            }
            return String(value);
        }

        function renderCard(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('card').style.display = 'block';
            document.getElementById('title').textContent = data.title || 'Metric';
            document.getElementById('value').textContent = formatValue(data.value);

            const subtitleEl = document.getElementById('subtitle');
            if (data.subtitle) {
                subtitleEl.textContent = data.subtitle;
                subtitleEl.style.display = 'block';
            } else {
                subtitleEl.style.display = 'none';
            }

            updateSize();
        }

        window.addEventListener('message', (event) => {
            const message = event.data;
            if (!message || typeof message !== 'object' || message.jsonrpc !== '2.0') {
                return;
            }

            if (message.method === 'ui/notifications/tool-result') {
                renderCard(normalizeToolResult(message.params));
            }
        });

        requestParent('ui/initialize');
        notifyParent('ui/notifications/initialized');
        updateSize();
    </script>
</body>
</html>
