<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Action</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background, #fff);
            color: var(--foreground, #171717);
        }
        .card {
            border: 1px solid var(--border, #e5e5e5);
            border-radius: 16px;
            padding: 16px;
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.05), rgba(255,255,255,0));
        }
        .title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .summary { font-size: 14px; line-height: 1.5; margin-bottom: 10px; }
        .details { margin: 0 0 12px 0; padding-left: 18px; color: #555; font-size: 13px; }
        .actions { display: flex; gap: 8px; }
        .button {
            border: 0;
            border-radius: 10px;
            padding: 8px 12px;
            font-weight: 600;
        }
        .confirm { background: #00D084; color: white; }
        .cancel { background: #f1f5f9; color: #111827; }
        .status { margin-top: 10px; font-size: 13px; color: #444; min-height: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="title" class="title">Confirm next step</div>
        <div id="summary" class="summary"></div>
        <ul id="details" class="details"></ul>
        <div class="actions">
            <button id="confirm" class="button confirm">Continue</button>
            <button id="cancel" class="button cancel">Cancel</button>
        </div>
        <div id="status" class="status"></div>
    </div>

    <script>
        let rpcId = 0;
        let payload = null;
        let submitCounter = 0;
        function notifyParent(method, params = {}) {
            window.parent?.postMessage({ jsonrpc: '2.0', method, params }, '*');
        }
        function requestParent(method, params = {}) {
            rpcId += 1;
            window.parent?.postMessage({ jsonrpc: '2.0', id: `confirm-${rpcId}`, method, params }, '*');
        }
        function updateSize() {
            notifyParent('ui/notifications/size-changed', {
                width: Math.ceil(document.body.scrollWidth),
                height: Math.ceil(document.body.scrollHeight),
            });
        }
        function emitWorkflowSubmit(action, content, metadata = {}) {
            submitCounter += 1;
            window.parent?.postMessage({
                type: 'sparkflow.workflow.submit',
                workflowId: `confirm-action-${Date.now()}-${submitCounter}`,
                source: 'confirm-action',
                action,
                content,
                metadata,
            }, '*');
        }
        function tryParseJson(value) {
            if (typeof value !== 'string') return null;
            try { return JSON.parse(value); } catch { return null; }
        }
        function normalizeToolResult(params) {
            if (!params) return {};
            if (params.structuredContent && typeof params.structuredContent === 'object') return params.structuredContent;
            if (Array.isArray(params.content)) {
                const text = params.content.find((item) => item && item.type === 'text' && typeof item.text === 'string')?.text;
                const parsed = tryParseJson(text);
                if (parsed?.structuredContent) return parsed.structuredContent;
                if (parsed && typeof parsed === 'object') return parsed;
            }
            return params;
        }
        function render(data) {
            payload = data;
            document.getElementById('title').textContent = data.title || 'Confirm next step';
            document.getElementById('summary').textContent = data.summary || '';
            document.getElementById('confirm').textContent = data.confirmLabel || 'Continue';
            document.getElementById('cancel').textContent = data.cancelLabel || 'Cancel';
            const details = document.getElementById('details');
            details.innerHTML = '';
            (data.details || []).forEach((detail) => {
                const li = document.createElement('li');
                li.textContent = detail;
                details.appendChild(li);
            });
            updateSize();
        }

        document.getElementById('confirm').addEventListener('click', () => {
            document.getElementById('status').textContent = 'Confirmed. Continue with the selected next step.';
            if (payload?.continueMessage) {
                emitWorkflowSubmit('confirm', payload.continueMessage, {
                    summary: payload.summary || '',
                });
            }
            updateSize();
        });
        document.getElementById('cancel').addEventListener('click', () => {
            document.getElementById('status').textContent = 'Cancelled. Adjust filters or ask a narrower question.';
            if (payload?.cancelMessage) {
                emitWorkflowSubmit('cancel', payload.cancelMessage, {
                    summary: payload.summary || '',
                });
            }
            updateSize();
        });

        window.addEventListener('message', (event) => {
            const message = event.data;
            if (!message || typeof message !== 'object' || message.jsonrpc !== '2.0') return;
            if (message.method === 'ui/notifications/tool-result') {
                render(normalizeToolResult(message.params));
            }
        });

        requestParent('ui/initialize');
        notifyParent('ui/notifications/initialized');
        updateSize();
    </script>
</body>
</html>
