<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 16px;
            background: var(--background, #ffffff);
            color: var(--foreground, #171717);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        .table-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--foreground, #171717);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: var(--muted, #f5f5f5);
            padding: 10px 12px;
            text-align: left;
            font-weight: 500;
            border-bottom: 2px solid var(--border, #e5e5e5);
            cursor: pointer;
            user-select: none;
            transition: background 0.15s ease;
        }

        th:hover {
            background: var(--accent, #e5e5e5);
        }

        th.sorted-asc::after {
            content: ' ↑';
            font-size: 12px;
        }

        th.sorted-desc::after {
            content: ' ↓';
            font-size: 12px;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border, #e5e5e5);
        }

        tr:hover {
            background: var(--muted, #f9fafb);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted-foreground, #737373);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted-foreground, #737373);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border, #e5e5e5);
            border-top-color: var(--primary, #00D084);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="table-container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Loading data...</div>
        </div>
        <div id="content" style="display: none;">
            <h3 id="title" class="table-title"></h3>
            <table id="data-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📊</div>
                <div>No data to display</div>
            </div>
        </div>
    </div>

    <script>
        // State for sorting
        let currentSort = { column: null, direction: 'asc' };
        let currentData = { columns: [], rows: [], title: '' };
        let rpcId = 0;

        function notifyParent(method, params = {}) {
            window.parent?.postMessage({
                jsonrpc: '2.0',
                method,
                params,
            }, '*');
        }

        function requestParent(method, params = {}) {
            rpcId += 1;
            window.parent?.postMessage({
                jsonrpc: '2.0',
                id: `table-${rpcId}`,
                method,
                params,
            }, '*');
        }

        function updateSize() {
            const body = document.body;
            notifyParent('ui/notifications/size-changed', {
                width: Math.ceil(body.scrollWidth),
                height: Math.ceil(body.scrollHeight),
            });
        }

        function normalizeToolResult(params) {
            const payload = params?.structuredContent || params?.content || params || {};
            if (payload && typeof payload === 'object' && !Array.isArray(payload)) {
                return payload;
            }
            if (Array.isArray(payload)) {
                return { title: 'Results', rows: payload };
            }
            return { title: 'Results', rows: [] };
        }

        window.addEventListener('message', (event) => {
            const message = event.data;
            if (!message || typeof message !== 'object' || message.jsonrpc !== '2.0') {
                return;
            }

            if (message.method === 'ui/notifications/tool-result') {
                const data = normalizeToolResult(message.params);

                // Handle different data formats
                let columns = data.columns || [];
                let rows = data.rows || [];
                let title = data.title || 'Results';

                // If data has a 'result' key, unwrap it
                if (data.result && typeof data.result === 'object') {
                    if (Array.isArray(data.result)) {
                        rows = data.result;
                        if (rows.length > 0) {
                            columns = Object.keys(rows[0]);
                        }
                    }
                }

                // If rows is an array of objects, extract columns
                if (Array.isArray(rows) && rows.length > 0 && typeof rows[0] === 'object') {
                    columns = Object.keys(rows[0]);
                }

                // Store current data
                currentData = { columns, rows, title };

                // Render the table
                renderTable(columns, rows, title);
                return;
            }

            if (message.method === 'ui/notifications/tool-input') {
                return;
            }
        });

        function renderTable(columns, rows, title) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            // Set title
            document.getElementById('title').textContent = title;

            // Handle different data formats
            // Check for empty data
            if (!rows || rows.length === 0) {
                document.getElementById('data-table').style.display = 'none';
                document.getElementById('empty-state').style.display = 'block';
                updateSize();
                return;
            }

            document.getElementById('data-table').style.display = 'table';
            document.getElementById('empty-state').style.display = 'none';

            // Render header
            const thead = document.getElementById('table-head');
            thead.innerHTML = '<tr>' + columns.map((col, index) => {
                const sortClass = currentSort.column === index 
                    ? `sorted-${currentSort.direction}` 
                    : '';
                return `<th class="${sortClass}" onclick="sortTable(${index})">${formatColumnName(col)}</th>`;
            }).join('') + '</tr>';

            // Render body
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = rows.map(row => {
                if (typeof row === 'object') {
                    return '<tr>' + columns.map(col => {
                        const value = row[col];
                        return `<td>${formatValue(value)}</td>`;
                    }).join('') + '</tr>';
                } else {
                    return `<tr><td>${formatValue(row)}</td></tr>`;
                }
            }).join('');

            updateSize();
        }

        function sortTable(columnIndex) {
            // Toggle direction if same column
            if (currentSort.column === columnIndex) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = columnIndex;
                currentSort.direction = 'asc';
            }

            // Sort rows
            const column = currentData.columns[columnIndex];
            currentData.rows.sort((a, b) => {
                let valA = typeof a === 'object' ? a[column] : a;
                let valB = typeof b === 'object' ? b[column] : b;

                // Handle null/undefined
                if (valA == null) return 1;
                if (valB == null) return -1;

                // Compare values
                let comparison = 0;
                if (typeof valA === 'number' && typeof valB === 'number') {
                    comparison = valA - valB;
                } else {
                    comparison = String(valA).localeCompare(String(valB));
                }

                return currentSort.direction === 'asc' ? comparison : -comparison;
            });

            // Re-render
            renderTable(currentData.columns, currentData.rows, currentData.title);
        }

        function formatColumnName(name) {
            // Convert snake_case or camelCase to Title Case
            return String(name)
                .replace(/_/g, ' ')
                .replace(/([a-z])([A-Z])/g, '$1 $2')
                .replace(/\b\w/g, c => c.toUpperCase());
        }

        function formatValue(value) {
            if (value == null) return '-';
            if (typeof value === 'boolean') return value ? '✓' : '✗';
            if (typeof value === 'object') return JSON.stringify(value);
            return String(value);
        }

        requestParent('ui/initialize');
        notifyParent('ui/notifications/initialized');
        updateSize();
    </script>
</body>
</html>
