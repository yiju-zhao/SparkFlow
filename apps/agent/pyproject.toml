[project]
name = "sparkflow-agent"
version = "0.1.0"
description = "SparkFlow AI agents for research hub and RAG"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-openai",
    "langchain-core",
    "langgraph-cli[inmem]",
    "langchain-mcp-adapters",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "ragflow-sdk",
    "openai",
    "pydantic",
    "python-dotenv",
    "httpx",
    "copilotkit",
    "deepagents",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphs", "tools", "config", "prompts"]
