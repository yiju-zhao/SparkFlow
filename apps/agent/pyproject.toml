[project]
name = "sparkflow-agent"
version = "0.1.0"
description = "SparkFlow AI agents for research hub and RAG"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-openai",
    "langchain-deepseek",
    "langchain-core",
    "langgraph-cli[inmem]",
    "langchain-mcp-adapters",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "openai",
    "pydantic",
    "python-dotenv",
    "PyYAML>=6.0",
    "httpx",
    "copilotkit",
    "deepagents",
    "tavily-python",
    # Workflow server
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphs", "tools", "config", "prompts", "embeddings", "hermes"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]
# BGE-M3 (CPU) — pulls torch + transformers (~800MB).
# Only the offline backfill scripts use it; LangGraph runtime does not.
# Install separately on machines that run those scripts:
#   pip install -e ".[embeddings]"
embeddings = [
    "FlagEmbedding>=1.2",
]
