[project]
name = "sparkflow-agent"
version = "0.1.0"
description = "SparkFlow AI agents for research hub and RAG"
requires-python = ">=3.11"
dependencies = [
    # LangChain / LangGraph stack (runtime — `langgraph-cli` is dev-only,
    # see [project.optional-dependencies].dev)
    "langgraph",
    "langgraph-checkpoint-postgres",
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langchain-deepseek",
    "langchain-mcp-adapters",
    # Model Context Protocol (used by tools/toolbox_client.py)
    "mcp",
    # Other AI / SDK
    "openai",
    "deepagents",
    "tavily-python",
    "copilotkit",
    # Database
    "psycopg[binary]",
    # Core utilities
    "pydantic",
    "python-dotenv",
    "PyYAML>=6.0",
    "httpx",
    # Workflow server (FastAPI surface)
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    # LLM gateway — apps/web (Node) cannot reach LLM providers from inside
    # the corporate network, so it calls back here. LiteLLM normalizes the
    # 100+ provider chat-completions API and handles BYOK key + base URL.
    "litellm>=1.50",
    # Daily-digest ARQ worker queue
    "arq>=0.25",
    # Matcher workflow (Excel ingestion + ranking)
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphs", "tools", "config", "prompts", "embeddings", "hermes"]

[project.optional-dependencies]
dev = [
    # CLI on the developer's host (`langgraph dev/build/up`). [inmem] adds
    # the in-process server backing `langgraph dev`. Never used inside the
    # built image — the langgraph-api container runs its own server.
    "langgraph-cli[inmem]",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]
# BGE-M3 (CPU) — pulls torch + transformers (~800MB).
# Only the offline backfill scripts use it; LangGraph runtime does not.
# Install separately on machines that run those scripts:
#   pip install -e ".[embeddings]"
embeddings = [
    "FlagEmbedding>=1.2",
]
