    description: Optional fuzzy venue search
  - name: limit
    type: integer
    description: Maximum rows
statement: |
  SELECT
    v.id,
    v.name,
    COALESCE(v.type, '') AS type,
    COUNT(i.id)::int AS instance_count
  FROM venues v
  LEFT JOIN instances i ON i."venueId" = v.id
  WHERE ($1 IS NULL OR v.name ILIKE '%' || $1::text || '%')
  GROUP BY v.id, v.name, v.type
  ORDER BY v.name ASC
  LIMIT COALESCE($2, 20);
---
