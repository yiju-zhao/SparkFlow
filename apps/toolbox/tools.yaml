kind: tools
name: list-publication-affiliations
type: postgres-sql
source: sparkflow-postgres
description: List distinct publication affiliations for filter disambiguation.
parameters:
  - name: query
    type: string
    description: Optional fuzzy affiliation search
    required: false
  - name: venue
    type: string
    description: Optional venue name filter
    required: false
  - name: year
    type: integer
    description: Optional year filter
    required: false
  - name: limit
    type: integer
    description: Maximum rows
    required: false
statement: |
  SELECT aff.value AS value, COUNT(*)::int AS count
  FROM publications p
  JOIN instances i ON i.id = p."instanceId"
  JOIN venues v ON v.id = i."venueId"
  CROSS JOIN LATERAL unnest(p.affiliations) AS aff(value)
  WHERE ($1 IS NULL OR aff.value ILIKE '%' || $1::text || '%')
    AND ($2 IS NULL OR v.name ILIKE '%' || $2::text || '%')
    AND ($3 IS NULL OR i.year = $3)
    AND aff.value IS NOT NULL
    AND aff.value <> ''
  GROUP BY aff.value
  ORDER BY count DESC, value ASC
  LIMIT COALESCE($4, 10);
