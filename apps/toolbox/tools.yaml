name: describe-publications-schema
type: postgres-sql
source: sparkflow-postgres
description: Describe publication fields, types, and recommended filters.
statement: |
  SELECT * FROM (
    VALUES
      ('title', 'text', 'Publication title'),
      ('authors', 'text[]', 'Author names array'),
      ('affiliations', 'text[]', 'Affiliation or company names array'),
      ('researchTopic', 'text', 'Primary research topic'),
      ('status', 'text', 'Publication status'),
