kind: tools
name: aggregate-publications
type: postgres-sql
source: sparkflow-postgres
description: |
  Aggregate publication counts by a specific dimension.
  Use this to get distribution of publications across years, venues, topics, or statuses.
  Example:
  {{
      "dimension": "i.year",
      "venue": "SIGMOD"
  }}
templateParameters:
  - name: dimension
    type: string
    description: The dimension to aggregate by
    allowedValues:
      - "i.year"
      - "v.name"
      - 'COALESCE(NULLIF(p."researchTopic", ''''), ''Unknown'')'
      - "COALESCE(NULLIF(p.status, ''), 'Unknown')"
parameters:
  - name: venue
    type: string
    description: Optional venue name filter
    required: false
  - name: year
    type: integer
    description: Optional year filter
    required: false
  - name: affiliation
    type: string
    description: Optional affiliation filter
    required: false
  - name: author
    type: string
    description: Optional author filter
    required: false
  - name: topic
    type: string
    description: Optional topic filter
    required: false
  - name: status
    type: string
    description: Optional publication status filter
    required: false
  - name: limit
    type: integer
    description: Maximum rows
    required: false
statement: |
  SELECT {{.dimension}} AS label, COUNT(*)::int AS value
  FROM publications p
  JOIN instances i ON i.id = p."instanceId"
  JOIN venues v ON v.id = i."venueId"
  WHERE ($1 IS NULL OR v.name ILIKE '%' || $1::text || '%')
    AND ($2 IS NULL OR i.year = $2)
    AND ($3 IS NULL OR EXISTS (SELECT 1 FROM unnest(p.affiliations) aff WHERE aff ILIKE '%' || $3::text || '%'))
    AND ($4 IS NULL OR EXISTS (SELECT 1 FROM unnest(p.authors) author WHERE author ILIKE '%' || $4::text || '%'))
    AND ($5 IS NULL OR COALESCE(p."researchTopic", '') ILIKE '%' || $5::text || '%')
    AND ($6 IS NULL OR COALESCE(p.status, '') ILIKE '%' || $6::text || '%')
  GROUP BY {{.dimension}}
  ORDER BY value DESC, label ASC
  LIMIT COALESCE($7, 12);
