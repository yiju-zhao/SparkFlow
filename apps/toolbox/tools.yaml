kind: tools
name: count-publications
type: postgres-sql
source: sparkflow-postgres
description: Count publications matching structured filters.
parameters:
  - name: venue
    type: string
    description: Optional venue name filter
  - name: year
    type: integer
    description: Optional year filter
  - name: affiliation
    type: string
    description: Optional affiliation filter
  - name: author
    type: string
    description: Optional author filter
  - name: topic
    type: string
    description: Optional topic filter
  - name: status
    type: string
    description: Optional publication status filter
statement: |
  SELECT COUNT(*)::int AS value
  FROM publications p
  JOIN instances i ON i.id = p."instanceId"
  JOIN venues v ON v.id = i."venueId"
  WHERE ($1 IS NULL OR v.name ILIKE '%' || $1::text || '%')
    AND ($2 IS NULL OR i.year = $2)
    AND ($3 IS NULL OR EXISTS (SELECT 1 FROM unnest(p.affiliations) aff WHERE aff ILIKE '%' || $3::text || '%'))
    AND ($4 IS NULL OR EXISTS (SELECT 1 FROM unnest(p.authors) author WHERE author ILIKE '%' || $4::text || '%'))
    AND ($5 IS NULL OR COALESCE(p."researchTopic", '') ILIKE '%' || $5::text || '%')
    AND ($6 IS NULL OR COALESCE(p.status, '') ILIKE '%' || $6::text || '%');
---
kind: tools
name: list-publications
type: postgres-sql
source: sparkflow-postgres
description: List publications matching structured filters.
parameters:
  - name: venue
    type: string
    description: Optional venue name filter
  - name: year
    type: integer
    description: Optional year filter
  - name: affiliation
    type: string
    description: Optional affiliation filter
  - name: author
    type: string
    description: Optional author filter
  - name: topic
    type: string
    description: Optional topic filter
  - name: status
    type: string
    description: Optional publication status filter
  - name: limit
    type: integer
    description: Maximum rows
statement: |
  SELECT
    p.id,
    p.title,
    v.name AS venue,
    i.year,
    COALESCE(p."researchTopic", '') AS research_topic,
    COALESCE(p.status, '') AS status,
    p.authors,
    p.affiliations
  FROM publications p
  JOIN instances i ON i.id = p."instanceId"
  JOIN venues v ON v.id = i."venueId"
  WHERE ($1 IS NULL OR v.name ILIKE '%' || $1::text || '%')
    AND ($2 IS NULL OR i.year = $2)
    AND ($3 IS NULL OR EXISTS (SELECT 1 FROM unnest(p.affiliations) aff WHERE aff ILIKE '%' || $3::text || '%'))
    AND ($4 IS NULL OR EXISTS (SELECT 1 FROM unnest(p.authors) author WHERE author ILIKE '%' || $4::text || '%'))
    AND ($5 IS NULL OR COALESCE(p."researchTopic", '') ILIKE '%' || $5::text || '%')
    AND ($6 IS NULL OR COALESCE(p.status, '') ILIKE '%' || $6::text || '%')
  ORDER BY i.year DESC, p.title ASC
  LIMIT COALESCE($7, 20);
