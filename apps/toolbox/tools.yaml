kind: tools
name: list-publication-topics
type: postgres-sql
source: sparkflow-postgres
description: List distinct publication research topics for filter disambiguation.
parameters:
  - name: query
    type: string
    description: Optional fuzzy topic search
    required: false
  - name: venue
    type: string
    description: Optional venue name filter
    required: false
  - name: year
    type: integer
    description: Optional year filter
    required: false
  - name: limit
    type: integer
    description: Maximum rows
    required: false
statement: |
  SELECT topic AS value, COUNT(*)::int AS count
  FROM (
    SELECT COALESCE(NULLIF(p."researchTopic", ''), 'Unknown') AS topic
    FROM publications p
    JOIN instances i ON i.id = p."instanceId"
    JOIN venues v ON v.id = i."venueId"
    WHERE ($1 IS NULL OR COALESCE(p."researchTopic", '') ILIKE '%' || $1::text || '%')
      AND ($2 IS NULL OR v.name ILIKE '%' || $2::text || '%')
      AND ($3 IS NULL OR i.year = $3)
  ) matches
  GROUP BY topic
  ORDER BY count DESC, value ASC
  LIMIT COALESCE($4, 10);
