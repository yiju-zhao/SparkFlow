kind: tools
name: aggregate-instances
type: postgres-sql
source: sparkflow-postgres
description: |
  Aggregate conference instance counts by a specific dimension.
  Use this to get distribution of instances across years or venues.
  Example:
  {{
      "dimension": "i.year"
  }}
templateParameters:
  - name: dimension
    type: string
    description: The dimension to aggregate by
    allowedValues:
      - "i.year"
      - "v.name"
parameters:
  - name: venue
    type: string
    description: Optional venue filter
    required: false
  - name: year
    type: integer
    description: Optional year filter
    required: false
  - name: limit
    type: integer
    description: Maximum rows
    required: false
statement: |
  SELECT {{.dimension}} AS label, COUNT(*)::int AS value
  FROM instances i
  JOIN venues v ON v.id = i."venueId"
  WHERE ($1 IS NULL OR v.name ILIKE '%' || $1::text || '%')
    AND ($2 IS NULL OR i.year = $2)
  GROUP BY {{.dimension}}
  ORDER BY {{.dimension}} ASC
  LIMIT COALESCE($3, 12);
