---
kind: tools
name: list-publication-affiliations
type: postgres-sql
source: sparkflow-postgres
description: List distinct publication affiliations for filter disambiguation.
parameters:
  - name: query
    type: string
    description: Optional fuzzy affiliation search
  - name: venue
    type: string
    description: Optional venue name filter
  - name: year
    type: integer
    description: Optional year filter
  - name: limit
    type: integer
    description: Maximum rows
statement: |
  SELECT aff.value AS value, COUNT(*)::int AS count
  FROM publications p
  JOIN instances i ON i.id = p."instanceId"
  JOIN venues v ON v.id = i."venueId"
  CROSS JOIN LATERAL unnest(p.affiliations) AS aff(value)
  WHERE ($1 IS NULL OR aff.value ILIKE '%' || $1::text || '%')
    AND ($2 IS NULL OR v.name ILIKE '%' || $2::text || '%')
    AND ($3 IS NULL OR i.year = $3)
    AND aff.value IS NOT NULL
    AND aff.value <> ''
  GROUP BY aff.value
  ORDER BY count DESC, value ASC
  LIMIT COALESCE($4, 10);
---
kind: tools
name: list-publication-authors
type: postgres-sql
source: sparkflow-postgres
description: List distinct publication authors for filter disambiguation.
parameters:
  - name: query
    type: string
    description: Optional fuzzy author search
  - name: venue
    type: string
    description: Optional venue name filter
  - name: year
    type: integer
    description: Optional year filter
  - name: limit
    type: integer
    description: Maximum rows
statement: |
  SELECT author.value AS value, COUNT(*)::int AS count
  FROM publications p
  JOIN instances i ON i.id = p."instanceId"
  JOIN venues v ON v.id = i."venueId"
  CROSS JOIN LATERAL unnest(p.authors) AS author(value)
  WHERE ($1 IS NULL OR author.value ILIKE '%' || $1::text || '%')
    AND ($2 IS NULL OR v.name ILIKE '%' || $2::text || '%')
    AND ($3 IS NULL OR i.year = $3)
    AND author.value IS NOT NULL
    AND author.value <> ''
  GROUP BY author.value
  ORDER BY count DESC, value ASC
  LIMIT COALESCE($4, 10);
---
kind: tools
name: list-publication-topics
type: postgres-sql
source: sparkflow-postgres
description: List distinct publication topics for filter disambiguation.
parameters:
  - name: query
    type: string
    description: Optional fuzzy topic search
  - name: venue
    type: string
    description: Optional venue name filter
  - name: year
    type: integer
    description: Optional year filter
  - name: limit
    type: integer
    description: Maximum rows
statement: |
  SELECT topic AS value, COUNT(*)::int AS count
  FROM (
    SELECT COALESCE(NULLIF(p."researchTopic", ''), 'Unknown') AS topic
    FROM publications p
    JOIN instances i ON i.id = p."instanceId"
    JOIN venues v ON v.id = i."venueId"
    WHERE ($1 IS NULL OR COALESCE(p."researchTopic", '') ILIKE '%' || $1::text || '%')
      AND ($2 IS NULL OR v.name ILIKE '%' || $2::text || '%')
      AND ($3 IS NULL OR i.year = $3)
  ) matches
  GROUP BY topic
  ORDER BY count DESC, value ASC
  LIMIT COALESCE($4, 10);
---
