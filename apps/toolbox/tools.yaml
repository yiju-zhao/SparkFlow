kind: tools
name: count-venues
type: postgres-sql
source: sparkflow-postgres
description: Count venues, optionally filtered by fuzzy name.
parameters:
  - name: query
    type: string
    description: Optional fuzzy venue search
    required: false
statement: |
  SELECT COUNT(*)::int AS value
  FROM venues v
  WHERE ($1 IS NULL OR v.name ILIKE '%' || $1::text || '%');
---
kind: tools
name: list-venues
type: postgres-sql
source: sparkflow-postgres
description: List venues, optionally filtered by fuzzy name.
parameters:
  - name: query
    type: string
    description: Optional fuzzy venue search
    required: false
  - name: limit
    type: integer
    description: Maximum rows
    required: false
statement: |
  SELECT
    v.id,
    v.name,
    COALESCE(v.type, '') AS type,
    COUNT(i.id)::int AS instance_count
  FROM venues v
  LEFT JOIN instances i ON i."venueId" = v.id
  WHERE ($1 IS NULL OR v.name ILIKE '%' || $1::text || '%')
  GROUP BY v.id, v.name, v.type
  ORDER BY v.name ASC
  LIMIT COALESCE($2, 20);
