# SparkFlow local dev services (Postgres + Redis)
# Usage: docker compose up -d
#
# On hosts behind a TLS-intercepting / forwarding proxy (HTTP_PROXY /
# HTTPS_PROXY auto-injected by ~/.docker/config.json), NO_PROXY must list
# every docker-network service hostname or library-level NO_PROXY checks
# route inter-container traffic through the host proxy. The compose file
# appends those service names to whatever the user already has set in
# their host shell / .env, so corporate intranet domains in $NO_PROXY are
# preserved.

name: sparkflow

# Reused by every service that does outbound HTTP (workers, web,
# workflows-api). Anchors are merged into each service's environment via
# `<<: *no_proxy_env`.
x-no-proxy-env: &no_proxy_env
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},postgres,redis,searxng,web,workflows-api,ingest-worker,digest-worker,migrate
  no_proxy: ${no_proxy:-localhost,127.0.0.1},postgres,redis,searxng,web,workflows-api,ingest-worker,digest-worker,migrate

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sparkflow-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sparkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sparkflow}
      POSTGRES_DB: ${POSTGRES_DB:-sparkflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sparkflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sparkflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Self-hosted SearXNG — default web search backend used by
  # apps/agent/tools/web.py when no Tavily BYOK key is provided.
  # Internal use only (limiter disabled in config/settings.yml).
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: sparkflow-searxng
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng/config:/etc/searxng:rw
      - ./searxng/data:/var/cache/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
      # Splits into settings.yml's `ultrasecretkey` placeholder at startup.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-sparkflow-default-rotate-in-prod}
    restart: unless-stopped

  ingest-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: sparkflow-ingest-worker
    command: ["npm", "run", "worker:ingest"]
    env_file: .env
    environment:
      <<: *no_proxy_env
      # Override host-side localhost URLs with docker service hostnames.
      # apps/web/.env uses localhost so `npm run dev` works on the host.
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-sparkflow}:${POSTGRES_PASSWORD:-sparkflow}@postgres:5432/${POSTGRES_DB:-sparkflow}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  digest-worker:
    build:
      context: ../agent
      dockerfile: Dockerfile.worker
    container_name: sparkflow-digest-worker
    command: ["arq", "workflows.digest_worker.WorkerSettings"]
    env_file: ../agent/.env
    environment:
      <<: *no_proxy_env
      # Override host-side localhost URL with docker service hostname.
      REDIS_URL: redis://redis:6379
      SPARKFLOW_API_URL: ${SPARKFLOW_API_URL}
      SEMOPS_API_URL: ${SEMOPS_API_URL}
      INTERNAL_CALLBACK_TOKEN: ${INTERNAL_CALLBACK_TOKEN}
      DIGEST_WORKER_CONCURRENCY: ${DIGEST_WORKER_CONCURRENCY:-4}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Production-only services (opt-in) ─────────────────────────────────────
  # Default `docker compose up -d` runs only postgres/redis/workers so local
  # dev keeps using `npm run dev` on the host (faster HMR than bind-mount)
  # and `make serve` on the host (which also binds 2027 — a docker
  # workflows-api running by default would conflict with it).
  # For a production-style stack on a server, run:
  #     docker compose --profile prod up -d --build
  # That brings up workflows-api + migrate (one-shot) → web after migrations.

  workflows-api:
    profiles: ["prod"]
    build:
      context: ../agent
      dockerfile: Dockerfile.workflows-api
    container_name: sparkflow-workflows-api
    env_file: ../agent/.env
    environment:
      <<: *no_proxy_env
      # In-container service hostnames override host-side localhost URLs.
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-sparkflow}:${POSTGRES_PASSWORD:-sparkflow}@postgres:5432/${POSTGRES_DB:-sparkflow}
      SPARKFLOW_API_URL: ${SPARKFLOW_API_URL:-http://web:3001}
      SEMOPS_API_URL: ${SEMOPS_API_URL:-http://host.docker.internal:2025}
      # SearXNG runs in the same compose network — use the service name.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      INTERNAL_CALLBACK_TOKEN: ${INTERNAL_CALLBACK_TOKEN}
    ports:
      - "${WORKFLOWS_PORT:-2027}:2027"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      # Use builder stage: it has full node_modules (incl. prisma CLI's
      # transitive deps like `effect`). The slim runner stage only carries
      # cherry-picked @prisma/* dirs and breaks at CLI load time.
      target: builder
    container_name: sparkflow-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env
    environment:
      <<: *no_proxy_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-sparkflow}:${POSTGRES_PASSWORD:-sparkflow}@postgres:5432/${POSTGRES_DB:-sparkflow}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: sparkflow-web
    env_file: .env
    environment:
      <<: *no_proxy_env
      # Override host-side localhost URLs with docker service hostnames.
      DATABASE_URL: postgresql://${POSTGRES_USER:-sparkflow}:${POSTGRES_PASSWORD:-sparkflow}@postgres:5432/${POSTGRES_DB:-sparkflow}
      REDIS_URL: redis://redis:6379
      # WORKFLOWS_API_URL is wired to the docker service hostname; LangGraph
      # is NOT in this compose file (built/run separately via `langgraph
      # up`), so it falls back to host.docker.internal. Override either
      # via .env when deploying behind a reverse proxy.
      LANGGRAPH_API_URL: ${LANGGRAPH_API_URL:-http://host.docker.internal:2024}
      WORKFLOWS_API_URL: ${WORKFLOWS_API_URL:-http://workflows-api:2027}
      # Browser-bundled URL — must be reachable from the user's browser,
      # not from inside the docker network. Set to the public URL of the
      # workflows server (e.g. https://workflows.example.com).
      NEXT_PUBLIC_WORKFLOWS_API_URL: ${NEXT_PUBLIC_WORKFLOWS_API_URL:-http://localhost:2027}
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      workflows-api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
