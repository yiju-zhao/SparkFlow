# SparkFlow local dev services (Postgres + Redis)
# Usage: docker compose up -d

name: sparkflow

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sparkflow-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sparkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sparkflow}
      POSTGRES_DB: ${POSTGRES_DB:-sparkflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sparkflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sparkflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ingest-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: sparkflow-ingest-worker
    command: ["npm", "run", "worker:ingest"]
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  digest-worker:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: sparkflow-digest-worker
    command: ["arq", "workflows.digest_worker.WorkerSettings"]
    env_file: ../agent/.env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SPARKFLOW_API_URL: ${SPARKFLOW_API_URL}
      SEMOPS_API_URL: ${SEMOPS_API_URL}
      INTERNAL_CALLBACK_TOKEN: ${INTERNAL_CALLBACK_TOKEN}
      DIGEST_WORKER_CONCURRENCY: ${DIGEST_WORKER_CONCURRENCY:-4}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
