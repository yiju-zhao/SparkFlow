# SparkFlow Docker Compose
# Usage: docker compose up -d
# Note: LangGraph agent runs separately via 'langgraph up' in apps/agent/

name: sparkflow

services:
  postgres:
    image: postgres:17-alpine
    container_name: sparkflow-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sparkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sparkflow}
      POSTGRES_DB: ${POSTGRES_DB:-sparkflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sparkflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: sparkflow-web
    container_name: sparkflow-web
    env_file: .env
    command: node server.js
    environment:
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3003}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEXT_PUBLIC_LANGGRAPH_API_URL=${NEXT_PUBLIC_LANGGRAPH_API_URL:-http://localhost:8123}
      - MINERU_BASE_URL=${MINERU_BASE_URL:-http://mineru:8000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "3003:3001"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
